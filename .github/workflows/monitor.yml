# 查尔斯信号监控 · GitHub Actions 云端定时执行（日内交易模式）
# 日内模式：15M 级别为核心确认级别，扫描节奏设为每15分钟一次（对齐15M K线收线）
# 免费额度：私有仓库 2000 分钟/月
#   */15 一次 + pip缓存(约20秒/次) ≈ 2880次 × 20s ≈ 960分钟/月，余量充足
# 若使用公共仓库（Public）则不限分钟数（webhook 存在 Secrets 中，不会泄露）
name: charles-monitor

# 并发控制：同一时刻只保留一个运行中的 workflow（如 push 连续触发多个 run 时，
# 旧的立即取消、只跑最新的），避免并发 run 同时读到旧冷却记录导致重复推送
concurrency:
  group: charles-monitor
  cancel-in-progress: true

# 允许将模拟账户状态文件(paper_state.json)提交回仓库，保证云端状态不丢失
permissions:
  contents: write

on:
  schedule:
    # 每15分钟扫描一次（cron 使用 UTC 时间，UTC+8 = 北京时间）
    # 例：北京 09:00/09:15/09:30... = UTC 01:00/01:15/01:30...
    # 注意：GitHub 官方承认 schedule 存在延迟/跳过，高峰时可能数十分钟才执行
    - cron: '*/15 * * * *'
    # 每周一 09:00 北京时间(=01:00 UTC)推送模拟盘周报
    - cron: '0 1 * * 1'
    # 每月 1 日 09:00 北京时间(=01:00 UTC)推送模拟盘月报
    - cron: '0 1 1 * *'
  workflow_dispatch: {}   # 支持手动触发，用于测试
  push:
    # 兜底触发：每次向仓库推送代码也跑一次扫描，保证上传文件即能出结果
    branches: [ main, master ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'          # 缓存 pip 依赖，显著缩短运行时间、节省额度

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal scan
        env:
          # 企业微信 webhook 存在仓库 Secrets 中，key 名为 WECOM_WEBHOOK
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python monitor.py --once

      # 保活：GitHub schedule 依赖仓库活跃度，仓库长期无 push 会被推迟/跳过。
      # 每次运行后强制更新时间戳并推送（commit 带 [skip ci] 避免自激触发本 workflow），
      # 让仓库保持活跃，使下一个 schedule 更可能准点触发。
      - name: Keep repo active (touch & push)
        run: |
          git config user.name "charles-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .github
          echo "last_scan: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/last_scan.txt
          git add .github/last_scan.txt
          if git diff --cached --quiet; then
            echo "last_scan.txt unchanged, skip push"
          else
            git commit -m "chore(keep-alive): refresh last_scan timestamp [skip ci]"
            git push
          fi

  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure CJK font (for charts)
        run: |
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          fi

      - name: Push weekly report (Monday 09:00)
        if: github.event.schedule == '0 1 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          # 报告专用 webhook 存在仓库 Secrets 中，key 名为 REPORT_WECOM_WEBHOOK
          REPORT_WECOM_WEBHOOK: ${{ secrets.REPORT_WECOM_WEBHOOK }}
        run: python paper_report.py --period weekly --state paper_state.json --pdf

      - name: Push monthly report (1st 09:00)
        if: github.event.schedule == '0 1 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          REPORT_WECOM_WEBHOOK: ${{ secrets.REPORT_WECOM_WEBHOOK }}
        run: python paper_report.py --period monthly --state paper_state.json --pdf
