# =============================================
# 查尔斯信号监控系统 配置文件
# 使用前必读：把企业微信机器人 webhook 填入下方
# =============================================

# 企业微信群机器人 webhook（必填）
# 获取方式：企业微信群 → 右键群 → 添加群机器人 → 复制 Webhook 地址
# 也可通过环境变量 WECOM_WEBHOOK 传入，优先级高于此配置
wecom_webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=9dfe55d7-466f-4a34-b5dd-5d86e7251b24"

# 监控标的（true/false 控制开关）
symbols:
  btc:
    enabled: true
    name: "BTC永续"
    inst: "BTC_USDT"          # Gate.io 永续合约交易对（Weex 侧自动转为 BTCUSDT）
    exchange: "gate-futures,weex,gate,okx,binance"  # 主源 gate-futures永续，Weex现货为第二备援（仅BTC）
    min_move_pct: 0.15        # 触发信号的最小波动幅度(%)

  gold:
    enabled: true
    name: "黄金永续(XAU)"
    inst: "XAU_USDT"          # Gate 直接跟踪伦敦金 XAU 价格的永续合约（替代原 PAXG 代理）
    exchange: "gate-futures,gate,okx,binance"  # Weex 无黄金交易对，不加入备援
    min_move_pct: 0.10

# 信号引擎参数
engine:
  h1_lookback: 120            # 1H 级别参与计算的K线根数
  m15_lookback: 120           # 15M 级别参与计算的K线根数
  h4_lookback: 120            # 4H 级别参与计算的K线根数
  pivot_radius_h1: 3          # 1H swing 高/低点判断半径(左右各几根)
  pivot_radius_m15: 5         # 15M swing 半径
  level_cluster_pct: 0.15     # 关键水平聚类容差(%)
  fvg_min_pct: 0.05           # FVG缺口最小幅度(%)
  trend_ma: 50                # 趋势判断均线周期(1H)

# 模拟交易（信号命中自动开模拟单，不涉及真实资金）
# 参数含义：
#   enabled: true            # 是否开启模拟盘
#   initial_balance: 100     # 初始模拟资金(USDT)
#   leverage: 100            # 杠杆倍数（100x：价格反向波动1%即爆仓）
#   risk_per_trade_pct: 1.0  # 每笔风险占余额%(对应手册：单笔风控1%)
#   sl_pct: 0.8              # 止损距离%(入场价上下)；100x杠杆爆仓线1%，止损必须<1%
#   tp_rr: 2.0               # 止盈 = 止损距离 × 该倍数（0.8%×2=1.6%）
#   max_hold_hours: 24       # 最长持仓时间，超时按市价强平
#   state_file: "paper_state.json"  # 模拟账户状态文件（云端自动提交回仓库）
paper_trading:
  enabled: true
  initial_balance: 100
  leverage: 100
  risk_per_trade_pct: 1.0
  sl_pct: 0.8
  tp_rr: 2.0
  max_hold_hours: 24
  state_file: "paper_state.json"

# 扫描与推送（日内交易模式）
scanner:
  scan_interval_seconds: 300  # 本地部署的扫描间隔(秒)；GitHub Actions 云端由 cron '*/15' 控制
  cooldown_hours: 4           # 同一信号冷却时间(小时)：日内交易持仓周期短，4小时防刷屏
  cooldown_price_rearm_pct: 0.1  # 冷却期内价格相对上次推送变动超过该阈值(%) 视为新机会，允许重新推送；0.1%≈金价4美元
  push_test_on_start: true    # 启动时发送一条测试消息
