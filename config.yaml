# =============================================
# 查尔斯信号监控系统 配置文件
# 使用前必读：把企业微信机器人 webhook 填入下方
# =============================================

# 企业微信群机器人 webhook（必填）
# 获取方式：企业微信群 → 右键群 → 添加群机器人 → 复制 Webhook 地址
# 也可通过环境变量 WECOM_WEBHOOK 传入，优先级高于此配置
wecom_webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=97206f79-8953-4972-80eb-5edee6992c51"

# 模拟盘周报/月报推送 webhook（可选）
# paper_report.py --push 时使用；也可用环境变量 REPORT_WECOM_WEBHOOK 传入，优先级更高
report_wecom_webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=38b35cdc-bfc5-435d-a153-2be82e951112"

# 监控标的（true/false 控制开关）
symbols:
  btc:
    enabled: true
    name: "BTC永续"
    inst: "BTC_USDT"          # Gate.io 永续合约交易对（Weex 侧自动转为 BTCUSDT）
    exchange: "gate-futures,weex,gate,okx,binance"  # 主源 gate-futures永续，Weex现货为第二备援（仅BTC）
    min_move_pct: 0.15        # 触发信号的最小波动幅度(%)

  gold:
    enabled: true
    name: "黄金永续(XAU)"
    inst: "XAU_USDT"          # Gate 直接跟踪伦敦金 XAU 价格的永续合约（替代原 PAXG 代理）
    exchange: "gate-futures,gate,okx,binance"  # Weex 无黄金交易对，不加入备援
    min_move_pct: 0.10

# 信号引擎参数
engine:
  h1_lookback: 120            # 1H 级别参与计算的K线根数
  m15_lookback: 120           # 15M 级别参与计算的K线根数
  h4_lookback: 120            # 4H 级别参与计算的K线根数
  pivot_radius_h1: 3          # 1H swing 高/低点判断半径(左右各几根)
  pivot_radius_m15: 5         # 15M swing 半径
  level_cluster_pct: 0.15     # 关键水平聚类容差(%)
  fvg_min_pct: 0.05           # FVG缺口最小幅度(%)
  trend_ma: 50                # 趋势判断均线周期(1H)
  vol_surge_mult: 2.5         # 出量判定：当前成交量 / 近20根均量 超过该倍数视为出量

# 模拟交易（信号命中自动开模拟单，不涉及真实资金）
# 参数含义：
#   enabled: true            # 是否开启模拟盘
#   initial_balance: 100     # 初始模拟资金(USDT)
#   leverage: 100            # 杠杆倍数（100x：价格反向波动1%即爆仓）
#   risk_per_trade_pct: 1.0  # 每笔风险占余额%(对应手册：单笔风控1%)
#   use_structure_sl_tp: true# 按手册条件判定止盈止损：止损=结构位、止盈=目标位/出量/趋势转换；false 时回退固定百分比
#   breakeven_r: 3.0         # 锁盈触发阈值：浮盈达单笔风险 3R 时锁利润（用户确认口径：1:3 锁利润）
#   lock_profit_r: 2.0       # 锁盈位置 = 入场价 ± 2R 初始止损距离（锁定 2R 利润，用户确认）
#   sl_pct: 1.0              # 兜底止损距离%(入场价上下)；100x杠杆爆仓线1%，固定止损取 min(1%, 0.95%)
#   tp_rr_min: 2.0           # 目标盈亏比区间下限：止盈目标至少 2R 才有入场意义
#   tp_rr_max: 5.0           # 目标盈亏比区间上限：到 TP 止盈按 5R 计算（用户确认 1:2~1:5）
#   winrate_gate_pct: 70     # 胜率门槛：方向正确率≥70% 后再优化入场（复盘标准，不阻塞开仓）
#   max_hold_hours: 48       # 最长持仓时间，超时按市价强平
#   max_daily_trades: 10     # 单日过滤：日内开仓最多10单（自然日北京时间计数）
#   max_consecutive_losses: 3# 连亏过滤：连续亏损达3单暂停开仓，下个自然日自动重置
#   min_size_usdt: 5         # 最小下单量：名义仓位低于该值(USDT)跳过开仓（Weex 最小单量）
#   fee_taker: 0.0008        # 开/平仓手续费率（Weex 市价单 Taker 0.08%）
#   fee_maker: 0.0002        # Maker 费率（0.02%，模拟盘市价触发暂不使用）
#   state_file: "paper_state.json"  # 模拟账户状态文件（云端自动提交回仓库）
paper_trading:
  enabled: true
  initial_balance: 100
  leverage: 100
  cost_per_trade_usdt: 5
  risk_per_trade_pct: 1.0
  use_structure_sl_tp: true
  breakeven_r: 3.0
  lock_profit_r: 2.0
  sl_pct: 1.0
  tp_rr_min: 2.0
  tp_rr_max: 5.0
  winrate_gate_pct: 70
  max_hold_hours: 48
  max_daily_trades: 10
  max_consecutive_losses: 3
  min_size_usdt: 5
  fee_taker: 0.0008
  fee_maker: 0.0002
  state_file: "paper_state.json"

# 扫描与推送（日内交易模式）
scanner:
  scan_interval_seconds: 300  # 本地部署的扫描间隔(秒)；GitHub Actions 云端由 cron '*/15' 控制
  cooldown_hours: 4           # 同一信号冷却时间(小时)：日内交易持仓周期短，4小时防刷屏
  cooldown_price_rearm_pct: 0.1  # 冷却期内价格相对上次推送变动超过该阈值(%) 视为新机会，允许重新推送；0.1%≈金价4美元
  push_test_on_start: true    # 启动时发送一条测试消息
